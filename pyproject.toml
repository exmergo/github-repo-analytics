[build-system]
requires = ["setuptools==79.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-analytics"
version = "0.1.0"
description = "Free, reproducible open-source project analytics with Dex, DuckDB, and MetricFlow"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
dependencies = [
  "exmergo-dex-core[duckdb,semantic]==1.14.0",
  "pyyaml>=6,<7",
]

[project.scripts]
oss-analytics = "oss_analytics.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".data", ".venv", ".cache", "build", "dist", ".data-branch"]

[tool.setuptools.packages.find]
where = ["src"]
