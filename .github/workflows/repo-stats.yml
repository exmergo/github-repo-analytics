name: Collect and validate repository analytics
on:
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:
    inputs:
      accept_baseline:
        description: Accept reviewed structural/metric changes after a successful build
        type: boolean
        default: false
      live_smoke:
        description: Also run the token-free external example smoke test
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: repository-analytics
  cancel-in-progress: false
jobs:
  configuration:
    if: vars.ANALYTICS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: bash scripts/bootstrap.sh
      - id: sources
        env:
          # The built-in token cannot see a private repository other than this one.
          GITHUB_TOKEN: ${{ secrets.GHRS_TOKEN || github.token }}
        shell: bash
        run: |
          matrix=$(uv run --frozen oss-analytics matrix --verify-visibility | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit("; ".join(d.get("errors", []))) if d.get("status") != "ok" else print(json.dumps(d["data"]))')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  collect:
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One project's failure must not block publishing the others; validation still gates.
    continue-on-error: true
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.configuration.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: bash scripts/bootstrap.sh
      # The upstream action branches off the default branch when the data branch is missing,
      # which would copy this repository's code into it. Start it empty instead.
      - name: Create the data branch
        shell: bash
        run: |
          if ! git ls-remote --exit-code --heads origin github-repo-stats >/dev/null; then
            git worktree add --detach .data-init
            git -C .data-init switch --orphan github-repo-stats
            git -C .data-init -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit --allow-empty -m "Start the analytics data branch"
            git -C .data-init push origin HEAD:github-repo-stats
            git worktree remove --force .data-init
          fi
      - name: Preserve traffic using the existing action
        if: matrix.mode == 'collect'
        uses: jgehrcke/github-repo-stats@306db38ad131cab2aa5f2cd3062bf6f8aa78c1aa # v1.4.2
        with:
          repository: ${{ matrix.repository }}
          databranch: github-repo-stats
          ghtoken: ${{ secrets.GHRS_TOKEN }}
      - name: Prepare raw data checkout
        shell: bash
        run: |
          git fetch origin github-repo-stats
          git worktree add .data-branch FETCH_HEAD
      - name: Import and supplement
        env:
          # Public stargazer, fork, issue and release reads; a PAT raises the rate limit.
          GITHUB_TOKEN: ${{ secrets.GHRS_TOKEN || github.token }}
          TRACKED_REPOSITORY: ${{ matrix.repository }}
        run: uv run --frozen oss-analytics stage --repository "$TRACKED_REPOSITORY" --destination .data-branch
      - name: Persist raw history before validation
        env:
          TRACKED_REPOSITORY: ${{ matrix.repository }}
        run: |
          git -C .data-branch config user.name github-actions[bot]
          git -C .data-branch config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .data-branch add -- "$TRACKED_REPOSITORY"
          if ! git -C .data-branch diff --cached --quiet; then
            git -C .data-branch commit -m "Collect repository analytics"
            git -C .data-branch push origin HEAD:github-repo-stats
          fi
  validate-and-publish:
    needs: [configuration, collect]
    if: ${{ !cancelled() && needs.configuration.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: bash scripts/bootstrap.sh
      - name: Pin raw candidate and set aside the published baseline
        id: candidate
        run: |
          git fetch origin github-repo-stats
          candidate=$(git rev-parse FETCH_HEAD)
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
          git worktree add .data-branch "$candidate"
          # The committed .dex/snapshot.json holds the reviewed definitions; never overwrite it.
          if test -f .data-branch/analytics-state/snapshot.json; then
            mkdir -p .data
            cp .data-branch/analytics-state/snapshot.json .data/published-snapshot.json
          fi
      - name: Import pinned candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          DATA_REPOSITORY: ${{ github.repository }}
        # An internal candidate can contain multiple projects; each uses this same commit.
        run: uv run --frozen oss-analytics sync-candidate --revision "$CANDIDATE_SHA" --data-repository "$DATA_REPOSITORY"
      - run: uv run --frozen oss-analytics build
      - name: Check definitions against the committed baseline
        run: uv run --frozen oss-analytics check-definitions
      # Reviewed definitions come from the commit; warehouse drift is measured against the
      # last published state, unless a reviewed data change is explicitly accepted.
      - name: Adopt reviewed definitions, or establish or accept a baseline
        env:
          ACCEPT_BASELINE: ${{ inputs.accept_baseline || false }}
        run: |
          if ! test -f .data/published-snapshot.json || test "$ACCEPT_BASELINE" = true; then
            uv run --frozen oss-analytics baseline
          else
            uv run --frozen oss-analytics adopt-definitions --published .data/published-snapshot.json
          fi
      - name: Check model and metric contracts
        run: |
          uv run --frozen oss-analytics check
          uv run --frozen oss-analytics status --require-fresh
      - name: Advance the published baseline to the validated state
        run: uv run --frozen oss-analytics baseline
      - name: Optional external example smoke test
        if: inputs.live_smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --frozen pytest -q tests/test_live.py --live
      - name: Promote validated revision
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CODE_SHA: ${{ github.sha }}
        run: |
          uv run --frozen oss-analytics publish --destination .data-branch --data-commit "$CANDIDATE_SHA" --code-commit "$CODE_SHA"
          git -C .data-branch config user.name github-actions[bot]
          git -C .data-branch config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C .data-branch add published.json analytics-state
          if git -C .data-branch diff --cached --quiet; then
            echo "Publication unchanged"
            exit 0
          fi
          git -C .data-branch commit -m "Publish validated analytics revision"
          # Publication files are disjoint from raw folders, so rebasing onto new raw data is safe.
          for attempt in 1 2 3; do
            if git -C .data-branch push origin HEAD:github-repo-stats; then exit 0; fi
            git -C .data-branch pull --rebase origin github-repo-stats
          done
          exit 1
  report-failure:
    needs: [configuration, collect, validate-and-publish]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the collection failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Analytics collection is failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The scheduled run failed: $RUN_URL. Raw observations already collected are retained. See docs/operations.md#failures."
          if test -n "$number"; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
