  - name: closed_date
    description: "UTC close date; null while open."
  - name: merged_date
    description: "UTC merge date for pull requests; null if unmerged."
  - name: author_association
    data_tests:
    - not_null
    description: "GitHub author association first observed by collection."
  - name: is_first_time_contributor
